<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>SBG Mission Event 2026 — Demo Route Preview</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="site-header">
    <img class="site-logo" src="assets/images/mm-logo.png" alt="Mission logo" />
    <span class="emoji">🌿</span>
    <h1>Great Commission Quest</h1>
    <p>Demo Route &middot; Preview Challenge</p>
    <p>Singapore Botanic Gardens &middot; Mission Trip Fundraiser 2026</p>
  </div>
  <div class="wrap">
    <div id="teamList" class="team-list"></div>
    <p class="index-note">Tap your team's link to start the race</p>
  </div>
  <div class="site-footer">Demo Route &middot; Singapore Botanic Gardens Mission Trip Fundraiser 2026</div>

  <script src="assets/data.js"></script>
  <script>
    (function () {
      const list = document.getElementById("teamList");
      let html = "";
      Object.keys(TEAMS).forEach((teamId) => {
        const team = TEAMS[teamId];
        const seqText = team.sequence.map((n) => "CP" + n).join(" &rarr; ");
        html += `
          <a class="team-row" href="Team%20${teamId}.html">
            <span class="team-row-text">
              <span class="team-row-name">${team.label}</span>
              <span class="team-row-seq">${seqText}</span>
            </span>
            <span class="team-row-chevron">&rsaquo;</span>
          </a>`;
      });
      list.innerHTML = html;
    })();
  </script>
</body>
</html>
